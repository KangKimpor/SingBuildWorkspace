<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · SingBuild Workspace</title>
  <link rel="icon" href="../../public/brand/favicon.svg">
  <style>
    @font-face {
      font-family: 'SingBuild Sans';
      src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: light;
      --canvas: #fbfbfa;
      --card: #ffffff;
      --card-dot: rgba(26, 25, 23, 0.05);
      --text: #1a1918;
      --muted: #5e5c57;
      --border: #e6e5e1;
      --border-card: #dedcd6;
      --border-strong: #c5c3bc;
      --hover: #f4f3ef;
      --pressed: #eae8e2;
      --input-bg: #ffffff;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-focus: rgba(29, 78, 216, 0.16);
      --primary-bg: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-text: #ffffff;
      --chip-blue-bg: #eff6ff;
      --chip-blue-text: #1d4ed8;
      --chip-blue-border: #bfdbfe;
      --shadow-card: 0 1px 2px rgba(15, 15, 15, 0.04), 0 14px 34px -4px rgba(15, 15, 15, 0.08);
      --radius-card: 16px;
      --radius-control: 8px;
    }

    html[data-theme=dark] {
      color-scheme: dark;
      --canvas: #0e1014;
      --card: #151820;
      --card-dot: rgba(255, 255, 255, 0.05);
      --text: #f3f4f6;
      --muted: #9aa1af;
      --border: #262b36;
      --border-card: #313745;
      --border-strong: #454d60;
      --hover: #1d212b;
      --pressed: #242935;
      --input-bg: #0f1218;
      --accent: #8ab4f8;
      --accent-hover: #aecbfa;
      --accent-focus: rgba(138, 180, 248, 0.24);
      --primary-bg: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-text: #ffffff;
      --chip-blue-bg: rgba(138, 180, 248, 0.14);
      --chip-blue-text: #8ab4f8;
      --chip-blue-border: rgba(138, 180, 248, 0.3);
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.4), 0 20px 44px -8px rgba(0, 0, 0, 0.65);
    }

    * { box-sizing: border-box; }
    ::selection { background: rgba(37, 99, 235, 0.22); color: inherit; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      margin: 0;
      font-family: 'SingBuild Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI Variable Text', sans-serif;
      color: var(--text);
      background-color: var(--canvas);
      background-image: radial-gradient(var(--card-dot) 1px, transparent 1px);
      background-size: 24px 24px;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { cursor: pointer; color: inherit; touch-action: manipulation; }
    button:disabled { cursor: not-allowed; }
    button, input, a { -webkit-tap-highlight-color: transparent; }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    [hidden] { display: none !important; }
    svg { display: block; flex-shrink: 0; }

    .page { min-height: 100svh; display: block; }
    .auth-side {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      min-width: 0;
    }

    /* Top Brand & Controls */
    .top {
      align-self: start;
      padding: 30px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--text);
    }

    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand small {
      display: block;
      margin-top: 3px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: var(--card);
      color: var(--muted);
      font-size: 12px;
      font-weight: 550;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .header-action-btn:hover {
      background: var(--hover);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .header-action-btn[aria-pressed="true"] {
      background: var(--chip-blue-bg);
      color: var(--chip-blue-text);
      border-color: var(--chip-blue-border);
    }

    .theme {
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: var(--card);
      color: var(--muted);
      display: grid;
      place-items: center;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .theme:hover {
      background: var(--hover);
      color: var(--text);
      border-color: var(--border-strong);
    }

    /* Main Elevated Authentication Card */
    .form-wrap {
      width: min(400px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 32px;
      background: var(--card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
    }

    .card-badge-row {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 9px;
      border-radius: 9999px;
      background: var(--chip-blue-bg);
      border: 1px solid var(--chip-blue-border);
      color: var(--chip-blue-text);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: -0.03em;
      font-weight: 650;
      color: var(--text);
    }

    .subhead {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }

    .intro {
      color: var(--muted);
      margin: 0 0 24px;
      line-height: 1.55;
      font-size: 14px;
    }

    /* Google Button */
    .google {
      width: 100%;
      min-height: 46px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-control);
      background: var(--card);
      color: var(--text);
      font-weight: 550;
      font-size: 14px;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04);
      transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease, transform 0.08s ease;
    }

    .google:hover:not(:disabled) {
      background: var(--hover);
      border-color: var(--text);
    }

    .google:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: none;
    }

    .google:disabled {
      opacity: 0.65;
      background: var(--hover);
      border-color: var(--border);
    }

    /* Connecting Status Pill */
    .connecting-pill {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--chip-blue-bg);
      border: 1px solid var(--chip-blue-border);
      border-radius: var(--radius-control);
      color: var(--chip-blue-text);
      font-size: 12px;
      font-weight: 500;
      animation: fadeIn 0.2s ease-out;
    }

    .connecting-pill-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .connecting-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .connecting-cancel {
      padding: 2px 8px;
      border: 1px solid var(--chip-blue-border);
      border-radius: 4px;
      background: var(--card);
      color: var(--chip-blue-text);
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      transition: background 0.15s ease;
    }

    .connecting-cancel:hover {
      background: var(--hover);
    }

    .spinner-svg {
      animation: spin 0.85s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      margin: 22px 0;
    }

    .divider::before, .divider::after {
      content: '';
      height: 1px;
      background: var(--border);
      flex: 1;
    }

    /* Form & Fields */
    form { display: grid; gap: 16px; }
    .field { display: grid; gap: 7px; }

    label, .label-row {
      font-size: 13px;
      font-weight: 550;
      color: var(--text);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-control);
      padding: 0 13px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
      min-width: 0;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-focus);
      outline: none;
    }

    .text-button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 550;
      transition: color 0.15s ease;
    }

    .text-button:hover {
      color: var(--accent-hover);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .password { position: relative; }
    .password input { padding-right: 44px; }

    .reveal {
      position: absolute;
      inset: 4px 4px 4px auto;
      width: 36px;
      border: 0;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: transparent;
      color: var(--muted);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .reveal:hover {
      background: var(--hover);
      color: var(--text);
    }

    .hint {
      margin: 0;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
    }

    /* Password strength progress track */
    .password-meter {
      height: 3px;
      width: 100%;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }

    .password-meter-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease, background 0.2s ease;
    }

    /* Primary Action Button */
    .primary {
      width: 100%;
      min-height: 46px;
      border-radius: var(--radius-control);
      border: 1px solid transparent;
      background: var(--primary-bg);
      color: var(--primary-text);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin-top: 6px;
      box-shadow: 0 1px 2px rgba(15, 15, 15, 0.08);
      transition: background 0.15s ease, transform 0.08s ease;
    }

    .primary:hover {
      background: var(--primary-hover);
    }

    .primary:active {
      transform: translateY(1px);
    }

    .switch {
      text-align: center;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .switch .text-button { margin-left: 5px; }

    .back {
      margin-top: 20px;
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Message / Status View */
    .message-symbol-icon {
      width: 36px;
      height: 36px;
      color: var(--accent);
      margin-bottom: 16px;
    }

    .email-target {
      color: var(--text);
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .notice {
      margin: 18px 0 0;
      border: 1px solid var(--border);
      background: var(--hover);
      border-radius: var(--radius-control);
      padding: 13px 14px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    /* Trust row inside card */
    .card-trust {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .card-trust svg {
      width: 13px;
      height: 13px;
      color: var(--muted);
    }

    /* Page Bottom Footer */
    .bottom {
      align-self: end;
      padding: 20px 28px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
    }

    .bottom svg { width: 14px; height: 14px; }

    @media (max-width: 760px) {
      .top { padding: 20px 24px; }
      .brand { font-size: 16px; }
      .brand small { font-size: 11px; }
      .brand img { width: 28px; height: 28px; }
      .header-action-btn span { display: none; }
      .header-action-btn { width: 36px; padding: 0; justify-content: center; }
      .form-wrap { width: min(390px, calc(100% - 32px)); padding: 28px 22px; }
    }

    @media (max-width: 360px) {
      .form-wrap { width: calc(100% - 24px); padding: 24px 18px; }
      .top { padding: 16px; }
      h1 { font-size: 25px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .form-wrap {
        animation: cardEnter 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes cardEnter {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="sparkle" viewBox="0 0 24 24"><path d="M12 3v18m9-9H3m15.5-6.5L5.5 17.5m13 0L5.5 5.5"/></symbol>
  </defs></svg>
  <div class="page">
    <div class="auth-side">
      <header class="top">
        <div class="brand">
          <img src="../../public/brand/favicon.svg" alt="">
          <span class="brand-text">SingBuild<small>Workspace</small></span>
        </div>
        <div class="header-actions">
          <button class="header-action-btn" type="button" id="preview-connecting-btn" aria-pressed="false" title="Preview connecting state">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span>Preview connecting state</span>
          </button>
          <button class="theme" type="button" aria-label="Switch to dark mode" title="Change theme">
            <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><use href="#sun"/></svg>
          </button>
        </div>
      </header>
      <main class="form-wrap" id="main">
        <div id="form-view">
          <h1 id="heading" tabindex="-1">Welcome</h1>
          <p class="subhead" id="signin-sub">Access your projects, NBC workbooks, and live cloud sync.</p>
          <p class="intro" id="intro" hidden></p>
          <div id="social">
            <button class="google" type="button" id="google">
              <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#4285f4" d="M43.6 20.5H42V20H24v8h11.3A12 12 0 0 1 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8.1 3.1l5.7-5.7A20 20 0 0 0 4 24a20 20 0 0 0 40 0c0-1.2-.1-2.4-.4-3.5Z"/>
                <path fill="#34a853" d="m6.3 33.8 6.6-5.1A12 12 0 0 0 24 36c3.1 0 5.9-1.2 8-3l6.2 5.2A20 20 0 0 1 6.3 33.8Z"/>
                <path fill="#fbbc05" d="m4 24 2.3 9.8 6.6-5.1A12 12 0 0 1 12 24c0-1.8.4-3.5 1.1-5L6.5 14A20 20 0 0 0 4 24Z"/>
                <path fill="#ea4335" d="M24 4A20 20 0 0 0 6.5 14l6.6 5A12 12 0 0 1 24 12c3.1 0 5.9 1.2 8.1 3.1l5.7-5.7A20 20 0 0 0 24 4Z"/>
              </svg>
              Continue with Google
            </button>
            <div class="connecting-pill" id="connecting-pill" hidden role="status" aria-live="polite">
              <div class="connecting-pill-main">
                <svg class="spinner-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.25"/>
                  <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span class="connecting-text">Connecting to your account…</span>
              </div>
              <button class="connecting-cancel" type="button" id="connecting-cancel" aria-label="Cancel connecting to account">Cancel</button>
            </div>
            <div class="divider">or continue with email</div>
          </div>
          <form id="auth-form">
            <div class="field" id="name-field" hidden>
              <label for="name">Full name</label>
              <input id="name" name="name" autocomplete="name" placeholder="Your full name" maxlength="100" disabled>
            </div>
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required>
            </div>
            <div class="field" id="password-field">
              <div class="label-row">
                <label for="password">Password</label>
                <button class="text-button" type="button" id="forgot">Forgot password?</button>
              </div>
              <div class="password">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                <button class="reveal" type="button" aria-label="Show password" aria-pressed="false">
                  <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><use href="#eye"/></svg>
                </button>
              </div>
              <div class="password-meter" id="password-meter" hidden aria-hidden="true">
                <div class="password-meter-fill" id="password-meter-fill"></div>
              </div>
              <p class="hint" id="password-hint" hidden>Use at least 12 characters.</p>
            </div>
            <button class="primary" id="submit">
              <span>Sign in</span>
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><use href="#arrow"/></svg>
            </button>
          </form>
          <p class="switch" id="switch">
            <span>New to SingBuild?</span>
            <button class="text-button" type="button" id="switch-mode">Create an account</button>
          </p>
          <button class="text-button back" type="button" id="back" hidden>← Back to sign in</button>
          <div class="card-trust">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><use href="#lock"/></svg>
            <span>End-to-end cloud sync · Local recovery journal</span>
          </div>
        </div>
        <div id="message-view" hidden aria-live="polite">
          <svg class="message-symbol-icon" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <use id="message-symbol" href="#mail"/>
          </svg>
          <h1 id="message-heading" tabindex="-1">Check your inbox.</h1>
          <p class="intro" id="message-copy"></p>
          <p class="notice" id="message-note"></p>
          <button class="primary" type="button" id="message-back" style="margin-top:24px">Back to sign in</button>
        </div>
      </main>
      <footer class="bottom">
        <svg fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><use href="#lock"/></svg>
        <span>Sign in to access your workspace.</span>
      </footer>
    </div>
  </div>
  <script>
    const $ = (id) => document.getElementById(id)
    let mode = 'signin'
    const fields = { name: $('name'), email: $('email'), password: $('password') }
    document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    const themeButton = document.querySelector('.theme')
    function updateThemeLabel() {
      themeButton.setAttribute('aria-label', `Switch to ${document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'} mode`)
    }
    updateThemeLabel()
    themeButton.addEventListener('click', () => {
      document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
      updateThemeLabel()
    })

    const connectingBtn = $('preview-connecting-btn')
    const connectingPill = $('connecting-pill')
    const connectingCancel = $('connecting-cancel')
    let isConnecting = false

    function setConnecting(active) {
      isConnecting = active
      connectingBtn.setAttribute('aria-pressed', String(active))
      connectingPill.hidden = !active
      $('google').disabled = active
    }

    connectingBtn.addEventListener('click', () => setConnecting(!isConnecting))
    connectingCancel.addEventListener('click', () => setConnecting(false))

    fields.password.addEventListener('input', () => {
      if (mode === 'signup') {
        const len = fields.password.value.length
        const pct = Math.min(100, Math.round((len / 12) * 100))
        $('password-meter-fill').style.width = pct + '%'
        $('password-meter-fill').style.background = len >= 12 ? 'var(--chip-blue-text)' : 'var(--accent)'
      }
    })

    function changeMode(next, focus = true) {
      mode = next
      setConnecting(false)
      $('form-view').hidden = false
      $('message-view').hidden = true
      const signup = mode === 'signup', reset = mode === 'reset'
      $('heading').textContent = reset ? 'Forgot your password?' : signup ? 'Make room for good work.' : 'Welcome'
      $('intro').textContent = reset ? 'We’ll send you a link to reset your password.' : signup ? 'Create an account to get your workspace started.' : ''
      $('intro').hidden = !signup && !reset
      $('signin-sub').hidden = signup || reset
      $('name-field').hidden = !signup
      fields.name.disabled = !signup
      fields.name.required = signup
      $('password-field').hidden = reset
      fields.password.disabled = reset
      fields.password.required = !reset
      fields.password.value = ''
      fields.password.type = 'password'
      fields.password.autocomplete = signup ? 'new-password' : 'current-password'
      if (signup) fields.password.minLength = 12; else fields.password.removeAttribute('minlength')
      fields.password.setAttribute('aria-describedby', signup ? 'password-hint' : '')
      fields.password.placeholder = signup ? 'Create a password' : 'Enter your password'
      document.querySelector('.reveal').setAttribute('aria-label', 'Show password')
      document.querySelector('.reveal').setAttribute('aria-pressed', 'false')
      $('password-hint').hidden = !signup
      $('password-meter').hidden = !signup
      $('password-meter-fill').style.width = '0%'
      $('forgot').hidden = signup || reset
      $('social').hidden = reset
      $('switch').hidden = reset
      $('back').hidden = !reset
      $('submit').querySelector('span').textContent = reset ? 'Send reset link' : signup ? 'Create account' : 'Sign in'
      $('switch').querySelector('span').textContent = signup ? 'Already have an account?' : 'New to SingBuild?'
      $('switch-mode').textContent = signup ? 'Sign in' : 'Create an account'
      document.title = `${reset ? 'Reset password' : signup ? 'Create account' : 'Sign in'} · SingBuild Workspace`
      if (focus) $('heading').focus()
    }

    function message(title, copy, note, icon = 'mail') {
      $('form-view').hidden = true
      $('message-view').hidden = false
      $('message-heading').textContent = title
      $('message-copy').replaceChildren(...copy)
      $('message-note').textContent = note
      $('message-symbol').setAttribute('href', `#${icon}`)
      fields.password.value = ''
      $('message-heading').focus()
    }

    $('switch-mode').addEventListener('click', () => changeMode(mode === 'signup' ? 'signin' : 'signup'))
    $('forgot').addEventListener('click', () => changeMode('reset'))
    $('back').addEventListener('click', () => changeMode('signin'))
    $('message-back').addEventListener('click', () => changeMode('signin'))

    document.querySelector('.reveal').addEventListener('click', (event) => {
      const visible = fields.password.type === 'password'
      fields.password.type = visible ? 'text' : 'password'
      event.currentTarget.setAttribute('aria-label', visible ? 'Hide password' : 'Show password')
      event.currentTarget.setAttribute('aria-pressed', String(visible))
    })

    $('google').addEventListener('click', () => message('Continue with Google.', ['Choose your Google account to continue to SingBuild.'], 'In this preview, Google sign-in is simulated. No connection is made.', 'lock'))

    $('auth-form').addEventListener('submit', (event) => {
      event.preventDefault()
      const email = document.createElement('span')
      email.className = 'email-target'
      email.textContent = fields.email.value
      if (mode === 'signup') message('Check your inbox.', ['A confirmation link is on its way to ', email, '.'], 'Confirm your email to finish setting up your account. This preview does not send an email.')
      else if (mode === 'reset') message('Check your inbox.', ['A password reset link is on its way to ', email, '.'], 'Follow the link to choose a new password. This preview does not send an email.')
      else message('You’re ready to go.', ['Your workspace is ready.'], 'In the finished version, successful sign-in opens your workspace. This is a visual preview.', 'check')
    })

    changeMode('signin', false)
  </script>
</body>
</html>
